<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zone Trader — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262a33;
    --text: #e6e8ec;
    --muted: #8b93a1;
    --green: #3ecf8e;
    --red: #ef5b5b;
    --accent: #5b8def;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .card .value { font-size: 22px; font-weight: 600; margin-top: 6px; }
  .value.positive { color: var(--green); }
  .value.negative { color: var(--red); }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .panel h2 { font-size: 14px; margin: 0 0 16px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  .badge { padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 600; }
  .badge.buy { background: rgba(62,207,142,0.15); color: var(--green); }
  .badge.sell { background: rgba(239,91,91,0.15); color: var(--red); }
  .badge.open { background: rgba(91,141,239,0.15); color: var(--accent); }
  .badge.correct { color: var(--green); }
  .badge.incorrect { color: var(--red); }
  .controls { display: flex; gap: 10px; margin-bottom: 24px; }
  button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.active { border-color: var(--green); color: var(--green); }
  #predictBox {
    font-size: 13px;
    color: var(--muted);
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.live { background: var(--green); }
  .dot.paused { background: var(--muted); }
</style>
</head>
<body>

<h1>Zone Trader</h1>
<div class="subtitle" id="subtitle">Loading...</div>

<div class="controls">
  <button id="pauseBtn" onclick="pauseLoop()">Pause</button>
  <button id="resumeBtn" onclick="resumeLoop()">Resume</button>
  <button onclick="refreshAll()">Refresh now</button>
</div>

<div class="grid" id="statusGrid"></div>

<div class="panel">
  <h2>Equity Curve</h2>
  <canvas id="equityChart" height="80"></canvas>
</div>

<div class="panel">
  <h2>Live Setup Check</h2>
  <div id="predictBox">Checking...</div>
</div>

<div class="panel">
  <h2>Recent Trades</h2>
  <table>
    <thead>
      <tr>
        <th>Time</th><th>Direction</th><th>Entry</th><th>Exit</th>
        <th>Confidence</th><th>Status</th><th>Outcome</th>
      </tr>
    </thead>
    <tbody id="tradeRows"></tbody>
  </table>
</div>

<script>
const REFRESH_MS = 15000;
let chart;

function fmt(n, decimals = 2) {
  if (n === null || n === undefined) return "—";
  return Number(n).toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function pct(n) { return n === null || n === undefined ? "—" : (n * 100).toFixed(1) + "%"; }

async function fetchJSON(path, opts) {
  const res = await fetch(path, opts);
  return res.json();
}

function renderStatus(s) {
  document.getElementById("subtitle").innerHTML =
    `<span class="dot ${s.paused ? 'paused' : 'live'}"></span>` +
    `${s.symbol} · ${s.interval} · confidence ≥ ${s.confidence_threshold} · ` +
    `retraining ${s.retraining_enabled ? "on" : "off"}`;

  const pnl = s.current_equity !== undefined ? s.current_equity - s.starting_balance : null;
  const pnlClass = pnl > 0 ? "positive" : pnl < 0 ? "negative" : "";

  const cards = [
    { label: "Equity", value: `$${fmt(s.current_equity)}` , cls: pnlClass },
    { label: "P&L", value: `${pnl >= 0 ? "+" : ""}$${fmt(pnl)}`, cls: pnlClass },
    { label: "Position", value: s.has_open_position ? "Open" : "None", cls: "" },
    { label: "Trades (closed)", value: s.closed_trades, cls: "" },
    { label: "Accuracy (all time)", value: pct(s.overall_accuracy), cls: "" },
    { label: "Accuracy (last 50)", value: pct(s.recent_accuracy_last_50), cls: "" },
  ];

  document.getElementById("statusGrid").innerHTML = cards.map(c =>
    `<div class="card"><div class="label">${c.label}</div><div class="value ${c.cls}">${c.value}</div></div>`
  ).join("");

  document.getElementById("pauseBtn").classList.toggle("active", s.paused);
  document.getElementById("resumeBtn").classList.toggle("active", !s.paused);
}

function renderHistory(trades) {
  const rows = trades.slice().reverse().map(t => {
    const dirBadge = `<span class="badge ${t.direction === 'buy' ? 'buy' : 'sell'}">${t.direction.toUpperCase()}</span>`;
    const statusBadge = t.status === 'open'
      ? `<span class="badge open">OPEN</span>`
      : t.status;
    const outcomeBadge = t.correct === null || t.correct === undefined
      ? "—"
      : (t.correct == 1
          ? `<span class="badge correct">✓ correct</span>`
          : `<span class="badge incorrect">✗ wrong</span>`);
    const conf = t.predicted_proba_up !== undefined
      ? (Math.max(t.predicted_proba_up, 1 - t.predicted_proba_up) * 100).toFixed(0) + "%"
      : "—";

    return `<tr>
      <td>${t.timestamp ? new Date(t.timestamp).toLocaleString() : "—"}</td>
      <td>${dirBadge}</td>
      <td>${fmt(t.entry_price, 5)}</td>
      <td>${t.exit_price ? fmt(t.exit_price, 5) : "—"}</td>
      <td>${conf}</td>
      <td>${statusBadge}</td>
      <td>${outcomeBadge}</td>
    </tr>`;
  }).join("");

  document.getElementById("tradeRows").innerHTML = rows || `<tr><td colspan="7">No trades yet</td></tr>`;
}

function renderEquityCurve(points) {
  const labels = points.map(p => new Date(p.timestamp).toLocaleTimeString());
  const values = points.map(p => p.balance);

  if (chart) {
    chart.data.labels = labels;
    chart.data.datasets[0].data = values;
    chart.update();
    return;
  }

  const ctx = document.getElementById("equityChart").getContext("2d");
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: "Balance",
        data: values,
        borderColor: "#5b8def",
        backgroundColor: "rgba(91,141,239,0.08)",
        fill: true,
        tension: 0.15,
        pointRadius: 0,
        borderWidth: 2,
      }],
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#8b93a1", maxTicksLimit: 8 }, grid: { color: "#262a33" } },
        y: { ticks: { color: "#8b93a1" }, grid: { color: "#262a33" } },
      },
    },
  });
}

function renderPredictNow(p) {
  const box = document.getElementById("predictBox");
  if (!p.setup_found) {
    box.textContent = "No live setup detected right now.";
    return;
  }
  box.innerHTML =
    `Leg-in: <b>${p.leg_in_direction}</b> · ` +
    `Predicted breakout: <b>${p.predicted_direction}</b> · ` +
    `Confidence: <b>${(p.confidence * 100).toFixed(1)}%</b> · ` +
    `Would trade: <b style="color:${p.would_trade ? 'var(--green)' : 'var(--muted)'}">${p.would_trade ? "yes" : "no"}</b>`;
}

async function refreshAll() {
  try {
    const [status, history, equity, predict] = await Promise.all([
      fetchJSON("/status"),
      fetchJSON("/history?limit=30"),
      fetchJSON("/equity_curve?limit=300"),
      fetchJSON("/predict_now"),
    ]);
    renderStatus(status);
    renderHistory(history.trades || []);
    renderEquityCurve(equity.points || []);
    renderPredictNow(predict);
  } catch (e) {
    console.error("Refresh failed", e);
  }
}

async function pauseLoop() {
  await fetchJSON("/pause", { method: "POST" });
  refreshAll();
}
async function resumeLoop() {
  await fetchJSON("/resume", { method: "POST" });
  refreshAll();
}

refreshAll();
setInterval(refreshAll, REFRESH_MS);
</script>
</body>
</html>
